# only works for Greenfield scenarios, uniform distribution is used for all parameters

general:
  replicates: 10 #10 is standard
  method: morris #Maybe other later
  covariance_plot: false

results: #define results from results folder
  system_costs: #name of result
    multiplier: 1e-9 #to change the unit of the result or to change the sign if the output in the csv is negative
    unit: billion € #unit of the result
    csv:
      filename: metrics.csv #name of the file
      identification_column_entries: total costs #has to be unique (otherwise raise error)
  co2_shadow_price:
    multiplier: -1
    unit: €/t
    csv:
      filename: metrics.csv
      identification_column_entries: co2_shadow
  biomass_use:
    multiplier: 1e-6
    unit: TWh
    csv:
      filename: custom_metrics.csv
      identification_column_entries: Biomass supply
  solar_electricity_production:
    multiplier: 1e-6
    unit: TWh
    csv:
      filename: custom_metrics.csv
      identification_column_entries: Solar electricity
  wind_electricity_production:
    multiplier: 1e-6
    unit: TWh
    csv:
      filename: custom_metrics.csv
      identification_column_entries: Wind electricity
  nuclear_electricity_production:
    multiplier: 1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Generator,nuclear,AC

  manure_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,manure,manure
  crop_residues_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,agricultural waste,agricultural waste
  logging_residues_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,fuelwood residues,fuelwood residues
  stemwood_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,fuelwoodRW,fuelwoodRW
  grasses_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,grasses,grasses
  sawdust_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,sawdust,sawdust
  secondary_forestry_residues_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,secondary forestry residues,secondary forestry residues
  woody_crops_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,woody crops,woody crops
  chips_and_pellets_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,C&P_RW,C&P_RW
  sludge_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,sludge,sludge
  residues_from_landscape_care_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,residues from landscape care,residues from landscape care
  biomass_import:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Link,solid biomass import,solid biomass import
  gas_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Generator,gas,gas
  oil_use:
    multiplier: -1e-6
    unit: TWh
    csv:
      filename: energy_balance.csv
      identification_column_entries: Generator,oil primary,oil primary

#they will get reorderd alphabetically
parameters:
  seq_potential: #name of parameter only for reference
    groupname: seq_potential #name of group for grouping the parameters, this one is used in the plots
    min: 200
    max: 710 # source doi: 10.1016/J.IJGGC.2022.103766
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      sector:
        co2_sequestration_potential:
          2050:
  
  ef_wind:
    groupname: ef_wind #E_loss x 0.13 ha/MW x r_elec; E_loss & r_elec co-vary with the SDR (min 108/1.91%, max 320/3.51%)
    min: 0.27 #ton/MW/year (108 tCO2/ha, r_elec 1.91%)
    max: 1.46 #ton/MW/year (320 tCO2/ha, r_elec 3.51%)
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      sector:
        renewable_emissions:
          onwind:

  ef_solar:
    groupname: ef_solar #E_loss x 1.15 ha/MW x r_elec; E_loss & r_elec co-vary with the SDR (min 108/1.91%, max 320/3.51%)
    min: 2.37
    max: 12.92
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      sector:
        renewable_emissions:
          solar:

  ef_solar-hsat:
    groupname: ef_solar-hsat #E_loss x 1.70 ha/MW x r_elec; E_loss & r_elec co-vary with the SDR (min 108/1.91%, max 320/3.51%)
    min: 3.51
    max: 19.09
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      sector:
        renewable_emissions:
          solar-hsat:

  nuclear_costs:
    groupname: nuclear_costs #name of group for grouping the parameters
    min: 2764000 #in €_2025/MW (= 2843 USD_2022/kW * 0.882171 EUR/USD on 2022-01-01 from ECB * 1.1020 HICP EA 2022->2025 = 0.9721)
    max: 8941000 #in €_2025/MW (= 9197 USD_2022/kW * 0.882171 EUR/USD on 2022-01-01 from ECB * 1.1020 HICP EA 2022->2025 = 0.9721)
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      costs:
        overwrites:
          investment:
            nuclear:

  electrolysis_investment:
    groupname: electrolysis_investment #name of group for grouping the parameters
    min: 306000 #in €_2025/MW (= 250000 €_2020/MW * 1.2256, HICP EA inflation 2020->2025); DEA Renewable Fuels 2025, sheet "1.1 AEC 100 MW", column "2050 Lower" (optimistic 2050 projection)
    max: 1471000 #in €_2025/MW (= 1200000 €_2020/MW * 1.2256, HICP EA inflation 2020->2025); DEA Renewable Fuels 2025, sheet "1.1 AEC 100 MW", column "2020" (current CAPEX, stagnant learning)
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      costs:
        overwrites:
          investment:
            electrolysis:

  ef_manure: #name of parameter only for reference
    groupname: ef_manure #name of group for grouping the parameters
    min: 0.009 #2.5 g/MJ
    max: 0.03312 #9.2 g/MJ
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          manure:
  ef_crop_residues: #name of parameter only for reference
    groupname: ef_crop_residues #name of group for grouping the parameters
    min: 0.00504 #1.4 g/MJ
    max: 0.01944 #5.4 g/MJ
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          agricultural waste:
  ef_logging_residues: #name of parameter only for reference
    groupname: ef_logging_residues #name of group for grouping the parameters
    min: 0.054 #15 g/MJ
    max: 0.2664 #74 g/MJ
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          fuelwood residues:
  ef_stemwood: #name of parameter only for reference
    groupname: ef_stemwood #name of group for grouping the parameters
    min: 0.0936 #26 g/MJ
    max: 0.4068 #113 g/MJ
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          fuelwoodRW:
  ef_grasses: #name of parameter only for reference
    groupname: ef_grasses #name of group for grouping the parameters
    min: 0.0957 #26.6 g/MJ (Y=4.2, r_E IQR)
    max: 0.5096 #141.5 g/MJ (Y=4.2, r_E IQR)
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          grasses:
  ef_sawdust: #name of parameter only for reference
    groupname: ef_sawdust #name of group for grouping the parameters
    min: 0.1188 #33 g/MJ
    max: 0.4104 #114 g/MJ
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          sawdust:
  ef_secondary_forestry_residues: #name of parameter only for reference
    groupname: ef_secondary_forestry_residues #name of group for grouping the parameters
    min: 0.1188 #33 g/MJ
    max: 0.4104 #114 g/MJ
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          secondary forestry residues:
  ef_woody_crops: #name of parameter only for reference
    groupname: ef_woody_crops #name of group for grouping the parameters
    min: 0.0879 #24.4 g/MJ (Y=4.2, r_E IQR)
    max: 0.4682 #130.1 g/MJ (Y=4.2, r_E IQR)
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          woody crops:
  ef_C&P_RW: #name of parameter only for reference
    groupname: ef_chips_and_pellets #name of group for grouping the parameters
    min: 0.1332 #37 g/MJ
    max: 0.4608 #128 g/MJ
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      biomass:
        emission_factors:
          C&P_RW:
  ef_biomass_import: #fraction of biomass combustion CO2 intensity (0.3667 tCO2/MWh); import-weighted ClimFor CSC, see supplement
    groupname: ef_biomass_import #name of group for grouping the parameters
    min: 0.29 #29 gCO2/MJ (import-weighted min)
    max: 1.06 #108 gCO2/MJ (import-weighted max)
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      sector:
        solid_biomass_import:
          upstream_emissions_factor:
      
  # Biomass feedstock cost bounds: ENS_Low/ENS_High weighted averages from JRC ENSPRESO
  # (originally EUR_2010), converted to EUR_2025 using the EEA-HICP cumulative deflator
  # 1.4443 applied by technology-data (matches Timon_09 central values exactly).
  costs_agricultural_waste: #name of parameter only for reference
    groupname: biomass_costs #name of group for grouping the parameters
    min: 14.49 #EUR_2025/MWh_th (= 10.03 * 1.4443)
    max: 18.30 #EUR_2025/MWh_th (= 12.67 * 1.4443)
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      costs:
        overwrites:
          fuel:
            Agricultural waste:
  costs_C&P_RW: #name of parameter only for reference
    groupname: biomass_costs #name of group for grouping the parameters
    min: 27.85 #EUR_2025/MWh_th (= 19.28 * 1.4443)
    max: 35.33 #EUR_2025/MWh_th (= 24.46 * 1.4443)
    config_file_location: #has to be a non-binary numerical value so that the sampling can be done
      costs:
        overwrites:
          fuel:
            C&P_RW:
  costs_logging_residues: #name of parameter only for reference
